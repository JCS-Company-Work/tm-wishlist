name: Deploy to Live

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to deploy"
        required: true
        default: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Configure SSH
        run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.TM_STORE_PASS }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Live
        run: |
          rsync -azc --delete \
            --omit-dir-times \
            --no-times \
            --no-perms \
            --no-owner \
            --no-group \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude=".DS_Store" \
            --exclude="vendor/" \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ \
            ${{ secrets.TM_STORE_SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.LIVE_DEPLOY_PATH }}

      - name: Complete
        run: echo "Live deployment complete."